[pytest]
testpaths = test_case
python_files = REC_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --self-contained-html
markers =
    p0: Priority P0 (critical)
    p1: Priority P1 (high)
    p2: Priority P2 (medium, default)
    p3: Priority P3 (low)
    smoke: Smoke tests
    regression: Regression tests
    browser_chromium: Use Chromium browser
    browser_edge: Use Edge browser